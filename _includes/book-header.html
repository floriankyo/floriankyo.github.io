<a class="book-back" href="{{ '/books/' | relative_url }}"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回 Books</a>
<header class="book-header">
  <div class="book-detail-cover">{% include book-cover.html book=include.book %}</div>
  <div class="book-heading">
    <h1>{{ include.book.title | escape }}</h1>
    {% if include.book.book_author %}<p class="book-author">{{ include.book.book_author | escape }}</p>{% endif %}
    {% if include.book.finished %}
      <p class="book-finished"><time datetime="{{ include.book.finished | date: '%Y-%m-%d' }}">{{ include.book.finished | date: '%Y.%m.%d' }}</time> 读完</p>
    {% endif %}
  </div>
</header>
