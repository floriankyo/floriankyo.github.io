<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" font-family="WenQuanYi Micro Hei, Heiti SC, PingFang SC, Noto Sans CJK SC, sans-serif">
  <title>四格模式 Fourfold pattern</title>
  <desc>High and low probability crossed with gains and losses. High-probability gains: risk aversion. High-probability losses: risk seeking. Low-probability gains: risk seeking. Low-probability losses: risk aversion. Examples are illustrative.</desc>
  <rect width="420" height="900" rx="18" fill="#f6f1e8"/>
  <rect x="1" y="1" width="418" height="898" rx="17" fill="none" stroke="#e0d3bf" stroke-width="2"/>

  <text x="210" y="38" text-anchor="middle" fill="#b83e48" font-size="22" font-weight="700">四格模式</text>
  <text x="210" y="62" text-anchor="middle" fill="#6d5a45" font-size="14">Fourfold pattern · 概率 × 得失</text>
  <text x="210" y="84" text-anchor="middle" fill="#8a7360" font-size="12">Probability × gains and losses</text>

  <rect x="12" y="100" width="194" height="40" rx="8" fill="#efe6d6"/>
  <rect x="214" y="100" width="194" height="40" rx="8" fill="#efe6d6"/>
  <text x="109" y="126" text-anchor="middle" fill="#3a2918" font-size="16" font-weight="700">收益 · Gains</text>
  <text x="311" y="126" text-anchor="middle" fill="#3a2918" font-size="16" font-weight="700">损失 · Losses</text>

  <text x="16" y="164" fill="#3a2918" font-size="14" font-weight="700">高概率 · High probability</text>
  <text x="404" y="164" text-anchor="end" fill="#6d5a45" font-size="12">确定性效应 · Certainty effect</text>

  <g>
    <rect x="12" y="176" width="194" height="292" rx="12" fill="#e7f2e6"/>
    <rect x="12" y="176" width="194" height="8" rx="4" fill="#3e7a50"/>
    <text x="26" y="210" fill="#2f6a40" font-size="18" font-weight="700">风险规避</text>
    <text x="26" y="232" fill="#3e7a50" font-size="13">Risk averse</text>
    <text x="26" y="268" fill="#3a2918" font-size="14">怕失望</text>
    <text x="26" y="290" fill="#3a2918" font-size="14">想把收益定下来</text>
    <text x="26" y="312" fill="#6d5a45" font-size="12">Fear of disappointment</text>
    <text x="26" y="348" fill="#3a2918" font-size="14">例：几乎稳赢时</text>
    <text x="26" y="370" fill="#3a2918" font-size="14">接受较少的确定所得</text>
    <text x="26" y="392" fill="#6d5a45" font-size="12">e.g. settle a near-sure win</text>
  </g>

  <g>
    <rect x="214" y="176" width="194" height="292" rx="12" fill="#f8e6e3"/>
    <rect x="214" y="176" width="194" height="8" rx="4" fill="#b83e48"/>
    <text x="228" y="210" fill="#9a3038" font-size="18" font-weight="700">风险寻求</text>
    <text x="228" y="232" fill="#b83e48" font-size="13">Risk seeking</text>
    <text x="228" y="268" fill="#3a2918" font-size="14">希望躲开</text>
    <text x="228" y="290" fill="#3a2918" font-size="14">一笔确定的亏损</text>
    <text x="228" y="312" fill="#6d5a45" font-size="12">Hope to avoid a sure loss</text>
    <text x="228" y="348" fill="#3a2918" font-size="14">例：很可能要赔时</text>
    <text x="228" y="370" fill="#3a2918" font-size="14">仍拒绝和解</text>
    <text x="228" y="392" fill="#6d5a45" font-size="12">e.g. fight a likely loss</text>
  </g>

  <text x="16" y="500" fill="#3a2918" font-size="14" font-weight="700">低概率 · Low probability</text>
  <text x="404" y="500" text-anchor="end" fill="#6d5a45" font-size="12">可能性效应 · Possibility effect</text>

  <g>
    <rect x="12" y="512" width="194" height="292" rx="12" fill="#f8efd4"/>
    <rect x="12" y="512" width="194" height="8" rx="4" fill="#9a7000"/>
    <text x="26" y="546" fill="#7d5c00" font-size="18" font-weight="700">风险寻求</text>
    <text x="26" y="568" fill="#9a7000" font-size="13">Risk seeking</text>
    <text x="26" y="604" fill="#3a2918" font-size="14">小概率大奖</text>
    <text x="26" y="626" fill="#3a2918" font-size="14">被看得偏重</text>
    <text x="26" y="648" fill="#6d5a45" font-size="12">A slim chance feels large</text>
    <text x="26" y="684" fill="#3a2918" font-size="14">例：买彩票</text>
    <text x="26" y="708" fill="#6d5a45" font-size="12">e.g. buy a lottery ticket</text>
  </g>

  <g>
    <rect x="214" y="512" width="194" height="292" rx="12" fill="#e5eef6"/>
    <rect x="214" y="512" width="194" height="8" rx="4" fill="#2b68a0"/>
    <text x="228" y="546" fill="#215484" font-size="18" font-weight="700">风险规避</text>
    <text x="228" y="568" fill="#2b68a0" font-size="13">Risk averse</text>
    <text x="228" y="604" fill="#3a2918" font-size="14">小概率的大损失</text>
    <text x="228" y="626" fill="#3a2918" font-size="14">被看得偏重</text>
    <text x="228" y="648" fill="#6d5a45" font-size="12">A rare loss feels vivid</text>
    <text x="228" y="684" fill="#3a2918" font-size="14">例：为罕见损失投保</text>
    <text x="228" y="708" fill="#6d5a45" font-size="12">e.g. insure against a rare loss</text>
  </g>

  <text x="210" y="840" text-anchor="middle" fill="#8a7360" font-size="12">例子只供说明，不是数据，也不保证结果。</text>
  <text x="210" y="860" text-anchor="middle" fill="#8a7360" font-size="12">Examples are illustrative, not data or guaranteed outcomes.</text>
</svg>
